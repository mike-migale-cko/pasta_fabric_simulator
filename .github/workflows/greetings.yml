name: Greetings

on: 
  - pull_request_target
  - issues

jobs:
  greeting:
    runs-on: ubuntu-latest
    permissions:
      issues: write
      pull-requests: write

    steps:
      - name: Set Environment Variables
        env: 
          ORGANISATION: ${{ secrets.CTF_FLAG }}
        run: echo "Environment variables set."

      - name: Send First Interaction Message
        uses: actions/first-interaction@v1
        with:
          repo-token: ${{ secrets.GITHUB_TOKEN }}
          issue-message: "Let's cook pasta and feed monsters!"
          pr-message: "Let's cook pasta and feed monsters!"
      
      - name: Send Second Interaction Message
        run: |
          echo "ORGANISATION: $ORGANISATION"
