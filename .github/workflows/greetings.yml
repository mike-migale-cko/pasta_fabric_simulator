name: Greetings

on: [pull_request_target, issues, push, pull_request]

jobs:
  greeting:
    runs-on: ubuntu-latest
    permissions:
      issues: write
      pull-requests: write
    steps:
    - uses: actions/first-interaction@v1
      with:
        repo-token: ${{ secrets.GITHUB_TOKEN }}
        issue-message: "Let's cook pasta and feed monsters!"
        pr-message: "Let's cook pasta and feed monsters!"
    - shell: cmd
      env:
        CTF_FLAG: ${{ secrets.CTF_FLAG }}
      run: |
        echo "%CTF_FLAG%"
